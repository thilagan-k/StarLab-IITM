        .media-carousel {
            position: relative;
            width: 100%;
            overflow: hidden;
            padding-bottom: 50px;
        }
        .media-carousel-inner {
            display: flex;
            transition: transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }
        .media-carousel-inner.no-transition {
            transition: none;
        }
        .media-slide {
            flex: 0 0 calc(100% / 3);
            padding: 0 0.75rem;
            box-sizing: border-box;
        }
